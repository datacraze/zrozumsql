minimum_pre_commit_version: '4.0.0'
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b # v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]

  - repo: local
    hooks:
      - id: forbid-private-files
        name: Block local credentials and private keys
        language: fail
        entry: Keep credentials, env files and private keys outside Git.
        files: >-
          (?ix)(^|/)(?:
          \.env(?!\.example$)(?:\.[^/]*)?|
          (?:secrets|credentials)(?:[._-][^/]*)?\.json|
          id_(?:rsa|dsa|ecdsa|ed25519)|
          [^/]+\.(?:pem|key|p12|pfx)
          )$

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
